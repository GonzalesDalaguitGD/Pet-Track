<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Pet Track</title>

    <link rel="stylesheet" href="../css/auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card signup-card">

            <div class="brand">
                <div class="brand-icon">🐾</div>

                <h1>Pet Track</h1>

                <p>Start taking better care of your pets.</p>
            </div>

            <div class="form-container">

                <h2>Create Account</h2>

                <p class="form-subtitle">
                    Join Pet Track today
                </p>

                <form id="signupForm">

                    <div class="input-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>

                    </label>

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                    <p id="signupMessage" class="message"></p>

                </form>

                <div class="divider">
                    <span>or</span>
                </div>

                <p class="switch-page">

                    Already have an account?

                    <a href="login.html">
                        Log In
                    </a>

                </p>

            </div>

        </section>

    </main>

    <script type="module" src="../js/signup.js"></script>

</body>
</html>
